name: API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run full collection (positive flow + negative tests)
        run: |
          newman run "My Collection.postman_collection.json" \
            -e "Testing environment.postman_environment.json" \
            -r cli,htmlextra \
            --reporter-htmlextra-export report-full.html

      - name: Run data-driven weak password tests
        if: always()
        run: |
          newman run "My Collection.postman_collection.json" \
            -e "Testing environment.postman_environment.json" \
            --folder "Weak Password (Data-Driven)" \
            -d weak-passwords.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export report-data-driven.html

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: report-*.html
